{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if or .Values.postgresql.enabled (ne .Values.database.mode "external") }}
{{- fail "Use the existing external PostgreSQL server." }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Listmonk requires one active replica." }}
{{- end }}
{{- if or (not .Values.database.external.existingSecret) (not .Values.listmonk.admin.existingSecret) (not .Values.bootstrap.rootURL) }}
{{- fail "Existing database/admin Secrets and bootstrap.rootURL are required." }}
{{- end }}
{{- if and .Values.bootstrap.smtp.enabled (not .Values.bootstrap.smtp.credentialsSecretName) }}
{{- fail "SES requires an existing dedicated SMTP credentials Secret." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listmonk.fullname" . }}
  labels:
    {{- include "listmonk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Terminate the old worker before migrating or attaching the uploads PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "listmonk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "listmonk.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.setup.waitImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              deadline=$(( $(date +%s) + DATABASE_WAIT_TIMEOUT ))
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}..."
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}"; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "PostgreSQL not reachable after ${DATABASE_WAIT_TIMEOUT}s" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "PostgreSQL is accepting connections."
          env:
            - name: DATABASE_WAIT_TIMEOUT
              value: {{ .Values.setup.databaseWaitTimeoutSeconds | quote }}
            - name: DB_HOST
              value: {{ .Values.database.external.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.external.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.external.username | quote }}
            - name: DB_NAME
              value: {{ .Values.database.external.name | quote }}
          {{- with .Values.setup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: db-init
          image: {{ include "listmonk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              ./listmonk --install --idempotent --yes --config="" &&
              ./listmonk --upgrade --yes --config=""
          env:
            {{- include "listmonk.appEnv" . | nindent 12 }}
            - name: LISTMONK_ADMIN_USER
              value: {{ .Values.listmonk.admin.username | quote }}
            - name: LISTMONK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.listmonk.admin.existingSecret }}
                  key: {{ .Values.listmonk.admin.existingSecretPasswordKey }}
          {{- with .Values.setup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: settings
          image: {{ .Values.setup.waitImage | quote }}
          command: ["psql", "-X", "--set=ON_ERROR_STOP=1", "--file=/bootstrap/settings.sql"]
          env:
            - name: PGHOST
              value: {{ .Values.database.external.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.external.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.external.name | quote }}
            - name: PGUSER
              value: {{ .Values.database.external.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.external.existingSecret }}
                  key: {{ .Values.database.external.existingSecretPasswordKey }}
            - name: PGSSLMODE
              value: {{ .Values.database.external.sslMode | quote }}
            - name: LISTMONK_ROOT_URL
              value: {{ .Values.bootstrap.rootURL | quote }}
            - name: LISTMONK_OIDC_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.secretName }}
                  key: LISTMONK_OIDC_CONFIG
            {{- range $key := list "LISTMONK_SMTP_ENABLED" "LISTMONK_SMTP_CONFIG" "LISTMONK_FROM_EMAIL" "LISTMONK_MESSAGE_RATE" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.bootstrap.secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- if .Values.bootstrap.smtp.enabled }}
            - name: LISTMONK_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.smtp.credentialsSecretName | quote }}
                  key: username
            - name: LISTMONK_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.smtp.credentialsSecretName | quote }}
                  key: password
            {{- end }}
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: listmonk
          image: {{ include "listmonk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - ./listmonk
            - "--config="
          ports:
            - name: http
              containerPort: {{ .Values.listmonk.port }}
              protocol: TCP
          env:
            {{- include "listmonk.appEnv" . | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: uploads
              mountPath: /listmonk/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: {{ .Values.bootstrap.configMapName }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "listmonk.fullname" . }}-uploads
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
