# SPDX-License-Identifier: Apache-2.0
# Environment values are supplied by Terraform; credentials are existing Secret references.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 1
listmonk:
  port: 9000
  admin:
    username: admin
    existingSecret: ""
    existingSecretPasswordKey: LISTMONK_ADMIN_PASSWORD
postgresql:
  enabled: false
database:
  mode: external
  external:
    host: ""
    port: 5432
    name: listmonk
    username: listmonk
    existingSecret: ""
    existingSecretPasswordKey: db_password
    sslMode: require
setup:
  waitImage: ""
  databaseWaitTimeoutSeconds: 300
  resources: {}
bootstrap:
  configMapName: listmonk-bootstrap
  secretName: listmonk-bootstrap
  rootURL: ""
  smtp:
    enabled: false
    credentialsSecretName: ""
service:
  type: ClusterIP
  port: 80
  annotations: {}
ingress:
  enabled: true
  ingressClassName: nginx
  annotations: {}
  hosts: []
  tls: []
storage:
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}
startupProbe:
  httpGet: {path: /health, port: http}
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
livenessProbe:
  httpGet: {path: /health, port: http}
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet: {path: /health, port: http}
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
terminationGracePeriodSeconds: 30
podAnnotations: {}
nodeSelector: {}
tolerations: []
resources: {}
