executeActionsSubject=Le tue credenziali per accedere a Bonus Elettrodomestici
executeActionsBody=Ciao, ti comunichiamo che il tuo profilo per accedere al portale del Bonus Elettrodomestici è stato attivato. Per poter accedere la prima volta, imposta una password. Una volta fatto, potrai accedere al portale con il tuo indirizzo email e la password che hai scelto. {0}Imposta la tua password Il link per impostare la password sarà valido per i prossimi {1}. Hai problemi tecnici o domande? Scrivi a portale.bonus@assistenza.pagopa.it.A presto, il team di Portale Bonus Ricevi questo messaggio perché hai un’utenza attiva nel Portale Bonus.
executeActionsBodyHtml=<div class=\"pageWrapper\"><header>\n<div style=\"padding-bottom: 2rem\">\n<div style=\"height: 5.063rem\">\n<img width=\"119\" height=\"33\" src=\"https://selfcare.pagopa.it/assets/logo_pagopacorp.png\" alt=\"PagoPa logo\"/>\n</div>\n<h1\nstyle=\"\nfont-size: 32px;\nline-height: 40px;\nfont-weight: 700;\nletter-spacing: 0;\n\"\n>\nIl tuo profilo sul portale del Bonus Elettrodomestici è stato attivato\n</h1>\n</div>\n</header>\n<table class=\"content\">\n<tbody>\n<tr>\n<td style=\"padding-bottom: 3rem\">Ciao,</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 3rem\">\nti comunichiamo che il tuo profilo per accedere al portale del Bonus Elettrodomestici è stato attivato.\n</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 3rem\">\nPer poter accedere la prima volta, <b style=\"font-weight: 600\">imposta una password</b>. <br/>\nUna volta fatto, potrai accedere al portale con il tuo indirizzo email e la password che hai scelto.\n</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 0.5rem\">\n<a style=\"color: #0073e6\" href=\"{0}\"\n>Imposta la tua password</a\n>\n</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 3rem\">Il link per impostare la password sarà valido per i prossimi {1}.</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 3rem\">\n<b style=\"font-weight: 600\">Hai problemi tecnici o domande?</b>\nScrivi a\n<a\nstyle=\"color: #0073e6\"\nhref=\"mailto:portale.bonus@assistenza.pagopa.it\"\n>portale.bonus@assistenza.pagopa.it.</a\n>\n</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 0.5rem\">A presto,</td>\n</tr>\n<tr>\n<td style=\"padding-bottom: 1.563rem\">il team di Portale Bonus</td>\n</tr>\n</tbody>\n<tfoot style=\"\nfont-size: 14px;\nline-height: 20px;\ncolor: #a2adb8;\n\">\n<tr>\n<td style=\"\nborder-top: 1px solid #e3e7eb;\npadding-top: 1.563rem;\n\">\nRicevi questo messaggio perché hai un’utenza attiva nel Portale Bonus.</td>\n</tr>\n</tfoot>\n</table>\n</div>

passwordResetSubject=Reimposta la tua password - Portale Punto Vendita
passwordResetBody=Ciao, abbiamo ricevuto una richiesta di reimpostazione della password per il tuo account sul Portale Punto Vendita. Per procedere, clicca sul link qui sotto: {0}Reimposta password Il link è valido per 30 minuti. Se non hai richiesto tu il reset, ignora questa email: la tua password resterà invariata. Per motivi di sicurezza, la nuova password dovrà contenere: Tra i 10 e i 64 caratteri Almeno una lettera maiuscola e una minuscola Almeno un numero Almeno un carattere speciale (es. ! @ \u0023 $) Hai problemi tecnici o domande? Scrivi a portale.punto.vendita@assistenza.pagopa.it. A presto, il team di Portale Bonus {0}Vai al sito Ricevi questo messaggio perché hai un’utenza attiva nel Portale Bonus.
passwordResetBodyHtml=<div class=\"pageWrapper\"><header><div style=\"padding-bottom: 2rem\"><div style=\"height: 5.063rem\"><img width=\"119\" height=\"33\" src=\"https://selfcare.pagopa.it/assets/logo_pagopacorp.png\" alt=\"PagoPa logo\"/></div><h1 style=\"font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: 0\">Reimposta la tua password - Portale Punto Vendita</h1></div></header><table class=\"content\"><tbody><tr><td style=\"padding-bottom: 3rem\">Ciao,</td></tr><tr><td style=\"padding-bottom: 0.5rem\">abbiamo ricevuto una richiesta di reimpostazione della password per il tuo account sul Portale Punto Vendita.</td></tr><tr><td style=\"padding-bottom: 3rem\">Per procedere, clicca sul link qui sotto:</td></tr><tr><td style=\"padding-bottom: 3rem\"><a style=\"color: #0073e6\" href=\"{0}\">Reimposta password</a></td></tr><tr><td style=\"padding-bottom: 3rem\">Il link è valido per 30 minuti. Se non hai richiesto tu il reset, ignora questa email: la tua password resterà invariata.</td></tr><tr><td style=\"padding-bottom: 1rem\">Per motivi di sicurezza, la nuova password dovrà contenere:</td></tr><tr><td style=\"padding-bottom: 3rem\"><ul><li>Tra i 10 e i 64 caratteri</li><li>Almeno una lettera maiuscola e una minuscola</li><li>Almeno un numero</li><li>Almeno un carattere speciale (es. ! @ \u0023 $)</li></ul></td></tr><tr><td style=\"padding-bottom: 3rem\"><b style=\"font-weight: 600\">Hai problemi tecnici o domande?</b> Scrivi a <br/><a style=\"color: #0073e6\" href=\"mailto:portale.punto.vendita@assistenza.pagopa.it\">portale.punto.vendita@assistenza.pagopa.it</a>.</td></tr><tr><td style=\"padding-bottom: 0.5rem\">A presto,</td></tr><tr><td>il team di Portale Bonus</td></tr><tr><td style=\"padding-top: 1.563rem; padding-bottom: 1.563rem\"><a style=\"text-decoration: none; color: #ffffff; line-height: 1\" class=\"btn-primary\" href=\"{0}\">Vai al sito</a></td></tr></tbody><tfoot style=\"font-size: 14px; line-height: 20px; color: #a2adb8;\"><tr><td style=\"border-top: 1px solid #e3e7eb; padding-top: 1.563rem;\">Ricevi questo messaggio perché hai un’utenza attiva nel Portale Bonus.</td></tr></tfoot></table></div>

